services:
  echo-prime:
    build: .
    command: >
      uvicorn blank_business_builder.echo_prime_api:app
      --host 0.0.0.0 --port 8001 --workers 2
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://bbbuser:${DATABASE_PASSWORD}@postgres:5432/bbb_production
      REDIS_URL: redis://redis:6379/0
      ECH0_LLM_PROVIDER: ${ECH0_LLM_PROVIDER:-openai}
      ECH0_LLM_API_KEY: ${ECH0_LLM_API_KEY:-}
      ECH0_LLM_ENDPOINT: ${ECH0_LLM_ENDPOINT:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bbb_internal

  paperclip:
    image: node:22-bookworm
    working_dir: /app
    command: >
      sh -c "npm install -g paperclipai@latest &&
      paperclipai run --host 0.0.0.0 --port 3100"
    environment:
      PAPERCLIP_BIND: "0.0.0.0:3100"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - paperclip_data:/root/.paperclip
    restart: unless-stopped
    networks:
      - bbb_internal

  api:
    environment:
      ECHO_PRIME_BASE_URL: http://echo-prime:8001
      ECHO_BASE_URL: http://echo-prime:8001
      PAPERCLIP_API_URL: http://paperclip:3100
      BBB_INTERNAL_API_TOKEN: ${BBB_INTERNAL_API_TOKEN:-}
    networks:
      - bbb_internal

  celery:
    environment:
      ECHO_PRIME_BASE_URL: http://echo-prime:8001
      PAPERCLIP_API_URL: http://paperclip:3100
    networks:
      - bbb_internal

networks:
  bbb_internal:
    driver: bridge

volumes:
  paperclip_data:
